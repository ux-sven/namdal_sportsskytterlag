name: Publiser nettside

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  # Startes av WordPress når noe publiseres (se wordpress/nssl-github-deploy.php)
  repository_dispatch:
    types: [wordpress-publish]
  # Reserve i tilfelle et varsel fra WordPress ikke kommer fram
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Gjenbruk nedlastede bilder
        uses: actions/cache@v4
        with:
          path: web/public/media
          key: wp-media-${{ github.run_id }}
          restore-keys: wp-media-
      - run: npm ci
      - name: Hent innhold fra WordPress og bygg
        run: npm run build
        env:
          WP_URL: ${{ vars.WP_URL || 'https://namdalssl.no' }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_REGISTRATION_URL: ${{ vars.PUBLIC_REGISTRATION_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
